# Flow local dependencies — Postgres only (safe on metered connections).
# Lightning: CoinOS (COINOS_TOKEN) or optional OpenNode/LND — no local chain.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
volumes:
  pg:
